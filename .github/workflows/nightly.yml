name: focim nightly builds

# Builds apps/focim -- the Focussed Nim Editor -- on a matrix of platforms and
# publishes the binaries to this repo's GitHub Releases. Each run creates one
# versioned release per commit (tag `nightly-<version>-<commit>`, version from
# uirelays.nimble), so download URLs pin an exact revision. The library's own
# build-and-test matrix lives in ci.yml and is intentionally kept separate:
# this workflow ships a binary, that one checks the code.

on:
  workflow_dispatch: {}
  schedule:
    # 08:00 UTC daily.
    - cron: '0 8 * * *'
  push:
    branches: [ master ]
    # On top of the daily build, a push cuts a nightly when ANY commit in the
    # push carries the marker `[rebuild]` in its message -- enforced by the
    # `prepare` job's `if:`. This keeps ordinary pushes off the 4-platform
    # build while still giving an on-demand force, e.g.:
    #   git commit --allow-empty -m 'publish focim [rebuild]'
    # or just run this workflow manually from the Actions tab.

# Publishing to this repo's own Releases only needs contents:write, so the
# built-in GITHUB_TOKEN suffices.
permissions:
  contents: write

# Never let two nightly runs race on the same release.
concurrency:
  group: focim-nightly
  cancel-in-progress: false

jobs:
  # ── Resolve the version/commit and create the release ──────────────────────
  prepare:
    runs-on: ubuntu-24.04
    # Scheduled and manual runs always proceed; a push builds only when one of
    # its commits opts in with the `[rebuild]` marker.
    if: >-
      github.event_name != 'push' ||
      contains(join(github.event.commits.*.message), '[rebuild]')
    outputs:
      commit: ${{ steps.decide.outputs.commit }}
      short: ${{ steps.decide.outputs.short }}
      date: ${{ steps.decide.outputs.date }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Determine version/commit and deploy decision
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          commit='${{ github.sha }}'
          short=${commit:0:9}
          date=$(date -u +'%Y-%m-%d')

          # The canonical version is the nimble file's, the same one `nimble
          # install` reports.
          version=$(grep -m1 '^version' uirelays.nimble | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "Could not read version from uirelays.nimble" >&2
            exit 1
          fi

          # One release per commit -- the tag carries the version and hash, so
          # download URLs are versioned rather than rolling.
          tag="nightly-$version-$short"

          echo "commit=$commit"  >> "$GITHUB_OUTPUT"
          echo "short=$short"    >> "$GITHUB_OUTPUT"
          echo "date=$date"      >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"        >> "$GITHUB_OUTPUT"

          # Skip a scheduled run only when this exact commit is already fully
          # published (all 4 platform assets present); a partial or failed
          # earlier run has fewer assets and will retry. Manual and `[rebuild]`
          # pushes always build -- uploads use --clobber, so re-publishing just
          # refreshes the assets.
          assets=0
          if count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length' 2>/dev/null); then
            assets=$count
          fi
          deploy=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$assets" -ge 4 ]; then
            echo "$tag already has $assets assets; nothing new to build."
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Create the release for this commit
        if: steps.decide.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.decide.outputs.tag }}'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "focim ${{ steps.decide.outputs.version }} nightly (${{ steps.decide.outputs.date }})" \
              --prerelease \
              --notes "Nightly build of apps/focim @ ${{ steps.decide.outputs.commit }} (version ${{ steps.decide.outputs.version }}, ${{ steps.decide.outputs.date }})."
          fi

  # ── Build + package focim per platform ─────────────────────────────────────
  build:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   cpu: amd64, runner: ubuntu-24.04,     ext: tar.xz }
          - { os: linux,   cpu: arm64, runner: ubuntu-24.04-arm, ext: tar.xz }
          - { os: macos,   cpu: arm64, runner: macos-15,         ext: tar.xz }
          - { os: windows, cpu: amd64, runner: windows-2025,     ext: zip }
    name: '${{ matrix.os }}-${{ matrix.cpu }}'
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: focim-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.short }}-${{ matrix.os }}_${{ matrix.cpu }}.${{ matrix.ext }}
    steps:
      - name: Set `core.autocrlf` to false
        run: |
          git config --global core.autocrlf false
          git config --global init.defaultBranch master

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1

      # No -dev packages: the X11 driver reaches libX11 and libXft through
      # `dynlib`, so nothing X11 is needed to compile and the binary links
      # only libc. What is installed here is what the smoke test needs to
      # actually open a window -- the runtime libraries, a display and a font.
      - name: Install what the Linux smoke test needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libxft2 fonts-dejavu-core x11-utils

      - name: Setup Nim
        uses: alaviss/setup-nim@0.1.1
        with:
          path: 'nim'
          version: devel
          architecture: ${{ matrix.cpu }}

      - name: Nim version
        run: nim --version

      - name: Build focim
        shell: bash
        run: |
          set -euo pipefail
          # apps/nim.cfg supplies --path:../src, so this works from the root.
          nim c -d:release --hints:off apps/focim.nim

      - name: Stage the package
        shell: bash
        run: |
          set -euo pipefail
          exe=focim
          if [ "${{ runner.os }}" = "Windows" ]; then exe=focim.exe; fi
          stage=staging/focim
          mkdir -p "$stage"
          cp "apps/$exe" "$stage/$exe"
          cp README.md LICENSE.md "$stage/"
          cp doc/focim/config.md "$stage/config.md"

          cat > "$stage/NIGHTLY.txt" <<EOF
          focim -- the Focussed Nim Editor, nightly build
          uirelays-commit: ${{ needs.prepare.outputs.commit }}
          version:         ${{ needs.prepare.outputs.version }}
          date:            ${{ needs.prepare.outputs.date }}
          platform:        ${{ matrix.os }}_${{ matrix.cpu }}

          Run ./$exe, optionally with a file to open. Tab 0 is [config]: its text
          is the layout and the color theme, and editing it changes the window on
          the next frame. See config.md.

          The config and the list of open tabs are written to focim/ under your
          config directory (~/.config/focim on Linux).

          On Linux the binary links only libc; X11 is loaded at runtime, so
          libX11.so.6 and libXft.so.2 have to be installed (apt install libx11-6
          libxft2) along with at least one font fontconfig can find.
          EOF

          if [ "${{ runner.os }}" = "macOS" ]; then
            cat >> "$stage/NIGHTLY.txt" <<'MAC'

          focim.app is this same build as an application bundle, which is what
          carries the icon on macOS -- drag it to /Applications. The bare focim
          runs from a terminal just as well. Neither is signed, so the first
          start needs the right-click Open, or:
              xattr -dr com.apple.quarantine focim.app
          MAC
          fi

      - name: Smoke test under Xvfb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # focim opens a window and stays up, so the check is that it is still
          # there a moment later -- a driver that cannot open a display, a
          # missing runtime library or a startup crash all end it early. While
          # the window is up it is asked what it carries: the icon is a
          # property on the window, so this is the icon as a desktop would
          # find it, not merely bytes that made it into the binary.
          cat > smoke.sh <<'SMOKE'
          set -euo pipefail
          staging/focim/focim &
          pid=$!
          # The window is looked up by WM_CLASS rather than by name: under a
          # reparenting window manager the frame answers to the name too and
          # carries none of the client's properties. And the icon is waited
          # for separately -- the window exists for a moment before it is set.
          win=""
          icon=""
          for _ in $(seq 1 60); do
            if [ -z "$win" ]; then
              for id in $(xwininfo -root -tree | grep -o '0x[0-9a-f]\+'); do
                case "$(xprop -id "$id" WM_CLASS 2>/dev/null || true)" in
                  *'"focim"'*) win=$id; break;;
                esac
              done
            fi
            if [ -n "$win" ]; then
              icon=$(xprop -id "$win" _NET_WM_ICON 2>/dev/null || true)
              case "$icon" in *"32 x 32"*|*"= 32, 32,"*) break;; esac
            fi
            sleep 0.25
          done
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "focim exited before it had a window" >&2
            exit 1
          fi
          [ -n "$win" ] || { echo "no window with WM_CLASS focim" >&2; exit 1; }
          # A taskbar matches this against StartupWMClass in a .desktop entry.
          xprop -id "$win" WM_CLASS
          # xprop draws the icon itself since 1.2.5 and lists raw cardinals
          # before that; either way the first image in the property is the
          # 32x32 one, and the 64 and 128 follow it.
          case "$icon" in
            *"Icon (32 x 32)"*|*"= 32, 32,"*)
              echo "_NET_WM_ICON:" \
                $(echo "$icon" | grep -o 'Icon ([0-9]* x [0-9]*)' | tr '\n' ' ') ;;
            "") echo "the window carries no _NET_WM_ICON" >&2; exit 1 ;;
            *)  echo "_NET_WM_ICON does not start with a 32x32 image" >&2; exit 1 ;;
          esac
          kill "$pid"
          SMOKE
          xvfb-run -a --server-args='-screen 0 1280x800x24' bash smoke.sh
          echo "focim opened a window and it has its icon on it"

      # macOS shows the icon of an application bundle, never of a bare binary,
      # so the mac artifact carries a focim.app next to the executable. It is
      # built by iconbundler -- the same tool that made the checked-in .netwm
      # and .ico -- from the same PNG, so all three platforms show one picture.
      - name: Bundle focim.app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.nimble/bin:$PATH"
          nimble install -y https://github.com/Araq/iconbundler
          # The art is copied out of the checkout first: iconbundler writes
          # what it derives next to the source PNG, and the working tree is
          # not the place for that.
          work=$(mktemp -d)
          cp apps/focim-icon.png "$work/"
          iconbundler focim apps/focim "$work/focim-icon.png" \
            --name focim --comment 'Focussed Nim Editor' \
            --bundle-id org.nim-lang.focim \
            --out staging/focim/focim.app
          app=staging/focim/focim.app
          test -x "$app/Contents/MacOS/focim"
          plutil -lint "$app/Contents/Info.plist"
          icns="$app/Contents/Resources/AppIcon.icns"
          size=$(wc -c < "$icns")
          echo "AppIcon.icns is $size bytes"
          # An .icns that iconutil wrote from ten images is tens of kilobytes;
          # anything tiny means the iconset went in empty.
          if [ "$size" -lt 20000 ]; then
            echo "AppIcon.icns is too small to hold the icon" >&2
            exit 1
          fi
          # It has to name the icon file, or the Finder shows a blank page.
          plutil -extract CFBundleIconFile raw "$app/Contents/Info.plist"

      # The .res that focim.nim links is checked in, so a missing icon here
      # would have failed the build rather than shipped quietly -- but the
      # frames are cheap to look for, and finding them says the resource
      # really made it into the executable.
      - name: Check the icon is in the exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          py=python; command -v python >/dev/null || py=python3
          # Take the largest frame out of the .ico and look for those exact
          # bytes in the executable: that is the resource the linker was
          # supposed to carry over, byte for byte, not a guess about one.
          "$py" - <<'PY'
          import struct, sys
          ico = open('apps/focim.ico', 'rb').read()
          n = struct.unpack('<H', ico[4:6])[0]
          *_, size, off = struct.unpack('<BBBBHHII', ico[6+(n-1)*16 : 6+n*16])
          frame = ico[off:off+size]
          exe = open('staging/focim/focim.exe', 'rb').read()
          at = exe.find(frame)
          print(f"largest icon frame: {size} bytes, found in the exe at {at}")
          sys.exit(0 if at >= 0 else 1)
          PY

      - name: Check the binary (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # These runners have no display to open a window on, so the check is
          # limited to the artifact itself.
          exe=focim
          if [ "${{ runner.os }}" = "Windows" ]; then exe=focim.exe; fi
          test -f "staging/focim/$exe"
          size=$(wc -c < "staging/focim/$exe")
          echo "$exe is $size bytes"
          if [ "$size" -lt 100000 ]; then
            echo "suspiciously small for a linked binary" >&2
            exit 1
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then otool -L "staging/focim/$exe"; fi

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ matrix.ext }}" = "zip" ]; then
            ( cd staging && 7z a -tzip -mx=9 "${{ github.workspace }}/out/$ASSET" focim >/dev/null )
          else
            tar -C staging -cJf "out/$ASSET" focim
          fi
          ls -lh out

      - name: Upload asset to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload '${{ needs.prepare.outputs.tag }}' "out/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload asset as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: out/${{ env.ASSET }}

  # ── Fill in the release notes once every platform succeeded ────────────────
  finalize:
    needs: [ prepare, build ]
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    env:
      V: ${{ needs.prepare.outputs.version }}
      S: ${{ needs.prepare.outputs.short }}
    steps:
      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          focim -- the Focussed Nim Editor.
          Built from uirelays @ ${{ needs.prepare.outputs.commit }}
          version ${V} · ${{ needs.prepare.outputs.date }}

          Downloads:
          - Linux x86_64:   focim-${V}-${S}-linux_amd64.tar.xz
          - Linux ARM64:    focim-${V}-${S}-linux_arm64.tar.xz
          - macOS ARM64:    focim-${V}-${S}-macos_arm64.tar.xz
          - Windows x86_64: focim-${V}-${S}-windows_amd64.zip

          Extract and run focim. On Linux, libX11.so.6 and libXft.so.2 are
          loaded at runtime and have to be present. The macOS archive also
          holds focim.app, the same build as a bundle, which is what shows the
          icon there. Tab 0 is [config]: its text is the window's layout and
          color theme.
          EOF
          )
          gh release edit '${{ needs.prepare.outputs.tag }}' --repo "$GITHUB_REPOSITORY" --notes "$notes"
